	Que.WAP to determinate grades on the given subjects-(Hindi,English,Homescience)

<html>
<head>
<script>
let Hindi=63;
let English=82;
let Hsi=92;
total=(Hindi+English+Hsi)/3;

if(total==100){
	console.log("A++");
}else if(90<total<100){
	console.log("A");
}else if(80<total<=90){
	console.log("B+");
}else if(70<total<=80){
	console.log("B");
}else if(60<total<=70){
	console.log("C");
}else if(50<total<=60){
	console.log("D");
}else if(40<total<=50){
	console.log("E");
}else if(total==40){
	console.log("barely passed");
}else{
	console.log("Failed F")
}


</script>
</head>
</html>
